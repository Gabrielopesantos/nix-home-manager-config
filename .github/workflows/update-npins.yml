name: update-npins

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix run nixpkgs#npins -- update
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "npins: weekly update"
          title: "npins: weekly update"
          labels: dependencies
          branch: update-npins
          add-paths: npins/sources.json
